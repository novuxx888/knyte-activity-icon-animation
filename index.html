<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Knyte States</title>

  <style>
    :root {
      --bg: #0b0b10;
      --panel: #11121a;
      --border: #343746;
      --accent: #8b5cf6;
      --text: #f5f5f7;
      --muted: #9ca3af;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }

    main {
      width: min(760px, 100%);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    .description {
      margin: 0 0 28px;
      color: var(--muted);
    }

    .controls,
    .subcontrols {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
    }

    .subcontrols {
      display: none;
    }

    .subcontrols.visible {
      display: flex;
    }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
    }

    button:hover {
      border-color: #5b6070;
    }

    button.active {
      border-color: var(--accent);
      background: rgba(139, 92, 246, 0.14);
    }

    .speed-wrap {
      margin: 6px 0 10px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .speed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 10px;
    }

    .speed-label {
      font-size: 14px;
      color: var(--muted);
    }

    .speed-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      color: var(--text);
      font-size: 14px;
    }

    input[type="range"] {
      width: 100%;
      cursor: pointer;
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      padding: 36px 0;
    }

    svg {
      width: min(340px, 82vw);
      height: auto;
      overflow: visible;
    }

    .base-border {
      fill: none;
      stroke: var(--border);
      stroke-width: 8;
      stroke-linejoin: round;
      opacity: 0.3;
    }

    .active-border {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.22));
    }

    .bar {
      fill: var(--accent);
      opacity: 0.08;
      transition: opacity 100ms linear;
      filter: drop-shadow(0 0 4px rgba(139, 92, 246, 0.18));
    }

    .bar.on {
      opacity: 1;
    }

    .pulse-border {
      animation: borderPulse 1.25s ease-in-out infinite;
    }

    .pulse-bar {
      animation: barPulse 1.25s ease-in-out infinite;
    }

    @keyframes borderPulse {
      0%, 100% {
        opacity: 0.42;
        filter: drop-shadow(0 0 4px rgba(139, 92, 246, 0.15));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 12px rgba(139, 92, 246, 0.45));
      }
    }

    @keyframes barPulse {
      0%, 100% {
        opacity: 0.45;
        filter: drop-shadow(0 0 3px rgba(139, 92, 246, 0.12));
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 10px rgba(139, 92, 246, 0.38));
      }
    }

    .status {
      text-align: center;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .state-name {
      color: var(--text);
      margin-bottom: 6px;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
  </style>
</head>

<body>
  <main>
    <h1>Knyte States</h1>
    <p class="description">Visual states for a Knyte execution agent.</p>

    <div class="controls">
      <button type="button" data-state="idle">Idle</button>
      <button type="button" data-state="active" class="active">Active</button>
      <button type="button" data-state="waiting">Waiting for input</button>
    </div>

    <div id="activeControls" class="subcontrols visible">
      <button type="button" data-active-mode="moving" class="active">Moving Border</button>
      <button type="button" data-active-mode="solid">Solid Border</button>
    </div>

    <div class="speed-wrap">
      <div class="speed-header">
        <div class="speed-label">Animation speed</div>
        <div id="speedValue" class="speed-value">300 ms / tick</div>
      </div>
      <input
        id="speedSlider"
        type="range"
        min="100"
        max="900"
        step="25"
        value="300"
      />
    </div>

    <div class="logo-wrap">
      <svg viewBox="0 0 260 260" role="img" aria-label="Animated Knyte logo">
        <path
          class="base-border"
          d="M47 72 L47 168 L130 216 L213 168 L213 72 L130 24 Z"
        />

        <path
          id="activeBorder"
          class="active-border"
          d="M47 72 L47 168 L130 216 L213 168 L213 72 L130 24 L47 72"
          pathLength="18"
          stroke-dasharray="3 15"
          stroke-dashoffset="0"
        />

        <g id="bars" transform="translate(0,-7)">
          <rect class="bar" x="74"  y="104" width="16" height="52"  rx="8" />
          <rect class="bar" x="98"  y="88"  width="16" height="84"  rx="8" />
          <rect class="bar" x="122" y="70"  width="16" height="120" rx="8" />
          <rect class="bar" x="146" y="88"  width="16" height="84"  rx="8" />
          <rect class="bar" x="170" y="104" width="16" height="52"  rx="8" />
        </g>
      </svg>
    </div>

    <div class="status">
      <div id="stateName" class="state-name">Active — Moving Border</div>
      <div id="status"></div>
    </div>

    <script>
      const border = document.getElementById("activeBorder");
      const bars = [...document.querySelectorAll(".bar")];
      const stateButtons = [...document.querySelectorAll("[data-state]")];
      const activeModeButtons = [...document.querySelectorAll("[data-active-mode]")];
      const activeControls = document.getElementById("activeControls");
      const stateName = document.getElementById("stateName");
      const status = document.getElementById("status");
      const speedSlider = document.getElementById("speedSlider");
      const speedValue = document.getElementById("speedValue");

      const executionStates = [
        [1, 0, 0, 0, 0], // 10000
        [1, 1, 0, 0, 0], // 11000
        [1, 1, 1, 0, 0], // 11100
        [1, 1, 1, 1, 0], // 11110
        [1, 1, 1, 1, 1], // 11111
        [0, 1, 1, 1, 1], // 01111
        [0, 0, 1, 1, 1], // 00111
        [0, 0, 0, 1, 1], // 00011
        [0, 0, 0, 0, 1]  // 00001
      ];

      const TOTAL_TICKS = 18;

      let currentState = "active";
      let activeMode = "moving";
      let tick = 0;
      let timer = null;
      let tickMs = Number(speedSlider.value);

      function updateSpeedLabel() {
        speedValue.textContent = `${tickMs} ms / tick`;
      }

      function stopTimer() {
        clearInterval(timer);
        timer = null;
      }

      function clearPulse() {
        border.classList.remove("pulse-border");
        bars.forEach(bar => bar.classList.remove("pulse-bar"));
      }

      function paintBars(state) {
        bars.forEach((bar, index) => {
          bar.classList.toggle("on", state[index] === 1);
        });
      }

      function setAllBarsOn() {
        paintBars([1, 1, 1, 1, 1]);
      }

      function setAllBarsOff() {
        paintBars([0, 0, 0, 0, 0]);
      }

      function drawAnimatedBars() {
        const barStateIndex = Math.floor(tick / 2);
        const barState = executionStates[barStateIndex];
        paintBars(barState);
        return {
          barStateIndex,
          barState
        };
      }

      function drawActiveMoving() {
        clearPulse();

        const { barStateIndex, barState } = drawAnimatedBars();
        const side = Math.floor(tick / 3) + 1;

        border.style.opacity = "1";
        border.setAttribute("stroke-dasharray", "3 15");
        border.style.strokeDashoffset = String(tick);

        stateName.textContent = "Active — Moving Border";
        status.textContent =
          `tick ${tick + 1}/18 · side ${side}/6 · bar ${barStateIndex + 1}/9 · ${barState.join("")}`;
      }

      function drawActiveSolid() {
        clearPulse();

        const { barStateIndex, barState } = drawAnimatedBars();

        border.style.opacity = "1";
        border.setAttribute("stroke-dasharray", "18 0");
        border.style.strokeDashoffset = "0";

        stateName.textContent = "Active — Solid Border";
        status.textContent =
          `tick ${tick + 1}/18 · bar ${barStateIndex + 1}/9 · ${barState.join("")} · solid border`;
      }

      function drawIdle() {
        clearPulse();
        setAllBarsOff();
        border.style.opacity = "0";
        stateName.textContent = "Idle";
        status.textContent = "00000 · border off";
      }

      function drawWaiting() {
        setAllBarsOn();
        border.style.opacity = "1";
        border.setAttribute("stroke-dasharray", "18 0");
        border.style.strokeDashoffset = "0";

        clearPulse();
        border.classList.add("pulse-border");
        bars.forEach(bar => bar.classList.add("pulse-bar"));

        stateName.textContent = "Waiting for input";
        status.textContent = "11111 · full border · pulsing";
      }

      function drawCurrentFrame() {
        if (currentState === "idle") {
          drawIdle();
          return;
        }

        if (currentState === "waiting") {
          drawWaiting();
          return;
        }

        if (activeMode === "moving") {
          drawActiveMoving();
        } else {
          drawActiveSolid();
        }
      }

      function advanceTick() {
        if (currentState !== "active") return;
        tick = (tick + 1) % TOTAL_TICKS;
        drawCurrentFrame();
      }

      function startActiveAnimation(resetTick = true) {
        stopTimer();
        clearPulse();

        if (resetTick) {
          tick = 0;
        }

        drawCurrentFrame();
        timer = setInterval(advanceTick, tickMs);
      }

      function setState(state) {
        currentState = state;

        stateButtons.forEach(button => {
          button.classList.toggle("active", button.dataset.state === state);
        });

        activeControls.classList.toggle("visible", state === "active");

        stopTimer();

        if (state === "idle") {
          drawIdle();
          return;
        }

        if (state === "waiting") {
          drawWaiting();
          return;
        }

        startActiveAnimation(true);
      }

      function setActiveMode(mode) {
        activeMode = mode;

        activeModeButtons.forEach(button => {
          button.classList.toggle("active", button.dataset.activeMode === mode);
        });

        if (currentState !== "active") return;

        startActiveAnimation(false);
      }

      stateButtons.forEach(button => {
        button.addEventListener("click", () => {
          setState(button.dataset.state);
        });
      });

      activeModeButtons.forEach(button => {
        button.addEventListener("click", () => {
          setActiveMode(button.dataset.activeMode);
        });
      });

      speedSlider.addEventListener("input", () => {
        tickMs = Number(speedSlider.value);
        updateSpeedLabel();

        if (currentState === "active") {
          startActiveAnimation(false);
        }
      });

      updateSpeedLabel();
      setState("active");
    </script>
  </main>
</body>
</html>
