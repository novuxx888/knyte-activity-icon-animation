<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="knyte-logo.png" />
  <title>Knyte States</title>

  <style>
    :root {
      --bg: #0b0b10;
      --panel: #11121a;
      --border: #343746;
      --accent: #8b5cf6;
      --text: #f5f5f7;
      --muted: #9ca3af;
      --pulse-duration: 5400ms;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 20px;
    }

    main { width: min(760px, 100%); }
    h1 { margin: 0 0 8px; font-size: 32px; }
    .description { margin: 0 0 28px; color: var(--muted); }

    .controls, .setting-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .controls { margin-bottom: 18px; }

    button {
      appearance: none;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font: inherit;
    }

    button:hover { border-color: #5b6070; }

    button.active {
      border-color: var(--accent);
      background: rgba(139, 92, 246, 0.14);
    }

    .settings {
      display: none;
      margin: 12px 0 24px;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .settings.visible { display: block; }
    .setting-row { margin-bottom: 20px; }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-title { margin-bottom: 9px; color: var(--muted); font-size: 14px; }

    .speed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }

    .speed-value {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    input[type="range"] { width: 100%; cursor: pointer; }

    .logo-wrap {
      display: flex;
      justify-content: center;
      padding: 30px 0 38px;
    }

    svg {
      width: min(340px, 82vw);
      height: auto;
      overflow: visible;
    }

    .base-border {
      fill: none;
      stroke: var(--border);
      stroke-width: 8;
      stroke-linejoin: round;
      opacity: 0.3;
    }

    .active-border {
      fill: none;
      stroke: var(--accent);
      stroke-width: 8;
      stroke-linejoin: round;
      stroke-linecap: round;
      filter: drop-shadow(0 0 6px rgba(139, 92, 246, 0.22));
    }

    .bar {
      fill: var(--accent);
      opacity: 0.08;
      transition: none;
    }

    .bar.on { opacity: 1; }

    /*
      Pulse brightness is driven entirely by the 18-tick JS master clock.
      No CSS animation clock, so there is nothing to drift or desync.
    */

    .status {
      text-align: center;
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .state-name {
      margin-bottom: 6px;
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
  </style>
</head>

<body>
  <main>
    <h1>Knyte States</h1>
    <p class="description">Modular visual states for a Knyte execution agent.</p>

    <div class="controls">
      <button type="button" data-state="idle">Idle</button>
      <button type="button" data-state="active" class="active">Active</button>
      <button type="button" data-state="waiting">Waiting for Input</button>
    </div>

    <section id="activeSettings" class="settings visible">
      <div class="setting-row">
        <div class="setting-title">Border</div>
        <div class="setting-options">
          <button type="button" data-active-border="moving" class="active">Moving</button>
          <button type="button" data-active-border="solid">Solid</button>
          <button type="button" data-active-border="off">Off</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-title">Bars</div>
        <div class="setting-options">
          <button type="button" data-active-bars="animated" class="active">Animated</button>
          <button type="button" data-active-bars="solid">Solid 11111</button>
          <button type="button" data-active-bars="off">Off</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-title">Bar Style</div>
        <div class="setting-options">
          <button type="button" data-active-bar-style="discrete" class="active">Discrete</button>
          <button type="button" data-active-bar-style="smooth">Smooth</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-title">Peak Hold</div>
        <div class="setting-options">
          <button type="button" data-active-peak-hold="hold" class="active">Hold</button>
          <button type="button" data-active-peak-hold="continuous">Continuous</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-title">Pulse</div>
        <div class="setting-options">
          <button type="button" data-active-pulse="none" class="active">None</button>
          <button type="button" data-active-pulse="both">Both</button>
          <button type="button" data-active-pulse="bars">Bars Only</button>
          <button type="button" data-active-pulse="border">Border Only</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-title">Pulse Style</div>
        <div class="setting-options">
          <button type="button" data-active-pulse-style="smooth" class="active">Smooth</button>
          <button type="button" data-active-pulse-style="binary">Binary</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="speed-header">
          <div class="setting-title">Speed</div>
          <div id="activeSpeedValue" class="speed-value">300 ms</div>
        </div>
        <input id="activeSpeedSlider" type="range" min="50" max="500" step="10" value="300" />
      </div>
    </section>

    <section id="waitingSettings" class="settings">
      <div class="setting-row">
        <div class="setting-title">Waiting Pulse</div>
        <div class="setting-options">
          <button type="button" data-waiting-pulse="both" class="active">Both</button>
          <button type="button" data-waiting-pulse="bars">Bars Only</button>
          <button type="button" data-waiting-pulse="border">Border Only</button>
          <button type="button" data-waiting-pulse="offset">Offset</button>
          <button type="button" data-waiting-pulse="none">None</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="setting-title">Pulse Style</div>
        <div class="setting-options">
          <button type="button" data-waiting-pulse-style="smooth" class="active">Smooth</button>
          <button type="button" data-waiting-pulse-style="binary">Binary</button>
        </div>
      </div>

      <div class="setting-row">
        <div class="speed-header">
          <div class="setting-title">Pulse Speed</div>
          <div id="waitingSpeedValue" class="speed-value">300 ms</div>
        </div>
        <input id="waitingSpeedSlider" type="range" min="50" max="500" step="10" value="300" />
      </div>
    </section>

    <div class="logo-wrap">
      <svg viewBox="0 0 260 260" role="img" aria-label="Knyte state visualization">
        <path
          class="base-border"
          d="M47 72 L47 168 L130 216 L213 168 L213 72 L130 24 Z"
        />

        <path
          id="activeBorder"
          class="active-border"
          d="M47 72 L47 168 L130 216 L213 168 L213 72 L130 24 L47 72"
          pathLength="18"
          stroke-dasharray="3 15"
          stroke-dashoffset="0"
        />

        <g id="barGroup" transform="translate(0,-7)">
          <rect class="bar" x="71"  y="99"  width="14" height="62"  rx="7" />
          <rect class="bar" x="97"  y="83"  width="14" height="94"  rx="7" />
          <rect class="bar" x="123" y="68"  width="14" height="124" rx="7" />
          <rect class="bar" x="149" y="83"  width="14" height="94"  rx="7" />
          <rect class="bar" x="175" y="99"  width="14" height="62"  rx="7" />
        </g>
      </svg>
    </div>

    <div class="status">
      <div id="stateName" class="state-name">Active</div>
      <div id="status"></div>
    </div>

    <script>
      const border = document.getElementById("activeBorder");
      const barGroup = document.getElementById("barGroup");
      const bars = [...document.querySelectorAll(".bar")];

      const stateButtons = [...document.querySelectorAll("[data-state]")];
      const activeBorderButtons = [...document.querySelectorAll("[data-active-border]")];
      const activeBarButtons = [...document.querySelectorAll("[data-active-bars]")];
      const activeBarStyleButtons = [...document.querySelectorAll("[data-active-bar-style]")];
      const activePeakHoldButtons = [...document.querySelectorAll("[data-active-peak-hold]")];
      const activePulseButtons = [...document.querySelectorAll("[data-active-pulse]")];
      const waitingPulseButtons = [...document.querySelectorAll("[data-waiting-pulse]")];
      const activePulseStyleButtons = [...document.querySelectorAll("[data-active-pulse-style]")];
      const waitingPulseStyleButtons = [...document.querySelectorAll("[data-waiting-pulse-style]")];

      const activeSettings = document.getElementById("activeSettings");
      const waitingSettings = document.getElementById("waitingSettings");

      const activeSpeedSlider = document.getElementById("activeSpeedSlider");
      const activeSpeedValue = document.getElementById("activeSpeedValue");
      const waitingSpeedSlider = document.getElementById("waitingSpeedSlider");
      const waitingSpeedValue = document.getElementById("waitingSpeedValue");

      const stateName = document.getElementById("stateName");
      const status = document.getElementById("status");

      /*
        ============================================================
        ONE MASTER TIMELINE
        ============================================================

        18 logical ticks per full cycle.

        Bars:
          9 states × 2 logical ticks = 18

        Border:
          6 sides × 3 logical ticks = 18

        Pulse:
          9 logical ticks brighten
          9 logical ticks dim

        Offset:
          +9 logical ticks (exact half-cycle)

        requestAnimationFrame only decides WHEN to draw.
        elapsed time decides WHERE everything is on the timeline.
      */

      const LOGICAL_TICKS = 18;
      const HALF_CYCLE = LOGICAL_TICKS / 2; // 9
      const MIN_BRIGHTNESS = 0.28;
      const MAX_BRIGHTNESS = 1.0;

      const executionStates = [
        [1,0,0,0,0], // 10000
        [1,1,0,0,0], // 11000
        [1,1,1,0,0], // 11100
        [1,1,1,1,0], // 11110
        [1,1,1,1,1], // 11111
        [0,1,1,1,1], // 01111
        [0,0,1,1,1], // 00111
        [0,0,0,1,1], // 00011
        [0,0,0,0,1]  // 00001
      ];

      const config = {
        idle: {
          border: "off",
          bars: "off",
          pulse: "none",
          pulseStyle: "smooth",
          speed: 300
        },
        active: {
          border: "moving",
          bars: "animated",
          barStyle: "discrete",
          peakHold: "hold",
          pulse: "none",
          pulseStyle: "smooth",
          speed: 300
        },
        waiting: {
          border: "solid",
          bars: "solid",
          pulse: "both",
          pulseStyle: "smooth",
          speed: 300
        }
      };

      let currentState = "active";

      /*
        phaseTicks is a CONTINUOUS value in [0,18).
        Example: 8.42 means we're 42% through logical tick 8.

        This is the single master position used by every visual.
      */
      let phaseTicks = 0;

      let rafId = null;
      let lastFrameTime = null;

      function settings() {
        return config[currentState];
      }

      function wrapPhase(value) {
        return ((value % LOGICAL_TICKS) + LOGICAL_TICKS) % LOGICAL_TICKS;
      }

      /*
        Advance the SAME master phase from real elapsed time.

        speed = milliseconds per logical tick.
        So if 16.67 ms elapsed on a 60 Hz display and speed = 300:
          phase advances by 16.67 / 300 logical ticks.

        No fixed microtick resolution is needed anymore.
      */
      function advanceMasterPhase(now) {
        if (lastFrameTime === null) {
          lastFrameTime = now;
          return;
        }

        const elapsedMs = now - lastFrameTime;
        lastFrameTime = now;

        if (currentState === "idle") return;

        phaseTicks = wrapPhase(
          phaseTicks + elapsedMs / settings().speed
        );
      }

      function paintBars(state) {
        bars.forEach((bar, i) => {
          bar.classList.toggle("on", state[i] === 1);
        });
      }

      function getBarState() {
        // Each visible bar state occupies exactly 2 logical ticks.
        const index = Math.floor(phaseTicks / 2) % executionStates.length;

        return {
          index,
          state: executionStates[index]
        };
      }

      /*
        Single pulse function.

        Smooth:
          phase 0  -> minimum
          phase 9  -> maximum
          phase 18 -> minimum

        Binary:
          first half bright
          second half dim

        Offset is NOT a separate pulse implementation.
        It is simply this exact function evaluated at phase + 9.
      */
      function pulseBrightness(phase, style) {
        const t = wrapPhase(phase);

        if (style === "binary") {
          return t < HALF_CYCLE
            ? MAX_BRIGHTNESS
            : MIN_BRIGHTNESS;
        }

        /*
          Smooth triangle waveform:
          0 -> 9  : brighten continuously
          9 -> 18 : dim continuously

          Because phase is continuous, this is smooth regardless
          of the selected logical-tick speed.
        */
        const normalized =
          t <= HALF_CYCLE
            ? t / HALF_CYCLE
            : (LOGICAL_TICKS - t) / HALF_CYCLE;

        return MIN_BRIGHTNESS +
          normalized * (MAX_BRIGHTNESS - MIN_BRIGHTNESS);
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function renderSmoothAnimatedBars() {
        /*
          Smooth bar animation driven only by phaseTicks.

          Hold:
            keeps 11111 fully lit for one state interval.

          Continuous:
            reaches 11111 only at the turning point, then
            immediately begins draining from the left.

          Both modes use a smooth wraparound:
            00001 -> crossfade -> 10000
          so the traveling signal remains continuous.
        */

        const MIN_BAR_OPACITY = 0.08;
        const brightness = [0, 0, 0, 0, 0];
        const continuousPeak = config.active.peakHold === "continuous";

        /*
          Hold mode uses the original 9-state spacing:
            fill 0..4
            full hold 4..5
            drain 5..8
            restart 8..9

          Continuous mode reallocates that plateau interval:
            fill 0..4
            drain 4..8
            restart 8..9

          This removes the full-brightness pause without introducing
          a second clock or changing the 18-tick master cycle.
        */
        const statePosition = phaseTicks / 2; // continuous 0..9

        if (!continuousPeak) {
          if (statePosition < 4) {
            // Fill left -> right.
            for (let i = 0; i < 5; i++) {
              brightness[i] = clamp(statePosition - i + 1, 0, 1);
            }
          } else if (statePosition < 5) {
            // Hold 11111.
            brightness.fill(1);
          } else if (statePosition < 8) {
            // Drain left -> right.
            const drainPosition = statePosition - 5;

            for (let i = 0; i < 5; i++) {
              brightness[i] = clamp(i - drainPosition + 1, 0, 1);
            }
          } else {
            /*
              Smooth wraparound:
                00001 -> crossfade -> 10000

              Rightmost fades out while leftmost fades in.
            */
            const restartPhase = statePosition - 8; // 0..1
            brightness[4] = 1 - restartPhase;
            brightness[0] = restartPhase;
          }
        } else {
          if (statePosition < 4) {
            // Fill left -> right, reaching 11111 at exactly 4.
            for (let i = 0; i < 5; i++) {
              brightness[i] = clamp(statePosition - i + 1, 0, 1);
            }
          } else if (statePosition < 8) {
            /*
              Immediately drain after the peak.
              Four state-position units are available here, so each
              left-to-right fade gets an equal continuous interval.
            */
            const drainPosition = statePosition - 4;

            for (let i = 0; i < 5; i++) {
              brightness[i] = clamp(i - drainPosition + 1, 0, 1);
            }
          } else {
            /*
              Smooth wraparound:
                00001 -> crossfade -> 10000

              Rightmost fades out while leftmost fades in.
            */
            const restartPhase = statePosition - 8; // 0..1
            brightness[4] = 1 - restartPhase;
            brightness[0] = restartPhase;
          }
        }

        bars.forEach((bar, i) => {
          bar.style.opacity = String(
            MIN_BAR_OPACITY +
            brightness[i] * (1 - MIN_BAR_OPACITY)
          );
        });
      }

      function clearBarInlineOpacity() {
        bars.forEach(bar => {
          bar.style.removeProperty("opacity");
        });
      }

      function renderBars(mode) {
        clearBarInlineOpacity();

        if (mode === "off") {
          paintBars([0,0,0,0,0]);
          return;
        }

        if (mode === "solid") {
          paintBars([1,1,1,1,1]);
          return;
        }

        if (
          currentState === "active" &&
          config.active.barStyle === "smooth"
        ) {
          /*
            Keep all bars structurally "on" and let inline
            opacity represent the smooth left-to-right wave.
          */
          bars.forEach(bar => bar.classList.add("on"));
          renderSmoothAnimatedBars();
          return;
        }

        paintBars(getBarState().state);
      }

      function renderBorder(mode) {
        if (mode === "off") {
          border.setAttribute("stroke-dasharray", "3 15");
          return;
        }

        if (mode === "solid") {
          border.setAttribute("stroke-dasharray", "18 0");
          border.style.strokeDashoffset = "0";
          return;
        }

        /*
          The SVG pathLength is 18, matching the logical timeline.
          So the continuous phase can be used directly.
        */
        border.setAttribute("stroke-dasharray", "3 15");
        border.style.strokeDashoffset = String(phaseTicks);
      }

      function applyPulse(target, style) {
        const normal = pulseBrightness(phaseTicks, style);

        /*
          Exact inverse phase.
          No second clock, CSS animation, delay, or restart logic.
        */
        const inverse = pulseBrightness(
          phaseTicks + HALF_CYCLE,
          style
        );

        let barBrightness = 1;
        let borderBrightness = 1;

        if (target === "both") {
          barBrightness = normal;
          borderBrightness = normal;
        } else if (target === "bars") {
          barBrightness = normal;
        } else if (target === "border") {
          borderBrightness = normal;
        } else if (target === "offset") {
          barBrightness = normal;
          borderBrightness = inverse;
        }

        barGroup.style.opacity = String(barBrightness);
        border.style.opacity = String(borderBrightness);
      }

      function renderStatus() {
        const s = settings();

        if (currentState === "idle") {
          stateName.textContent = "Idle";
          status.textContent = "00000 · border off";
          return;
        }

        if (currentState === "waiting") {
          stateName.textContent = "Waiting for Input";
          status.textContent =
            `11111 · full border · pulse ${s.pulse} (${s.pulseStyle}) · ` +
            `${s.speed} ms / logical tick`;
          return;
        }

        const { index, state } = getBarState();
        const logicalTick = Math.floor(phaseTicks);
        const side = Math.floor(phaseTicks / 3) + 1;

        stateName.textContent = "Active";
        status.textContent =
          `tick ${logicalTick + 1}/18 · side ${side}/6 · bar ${index + 1}/9 · ` +
          `${state.join("")} · bars ${s.barStyle}/${s.peakHold} · pulse ${s.pulse} (${s.pulseStyle})`;
      }

      function render() {
        const s = settings();

        renderBorder(s.border);
        renderBars(s.bars);
        applyPulse(s.pulse, s.pulseStyle);

        /*
          Pulse writes opacity after border/bar rendering.
          Enforce true "off" states last.
        */
        if (s.border === "off") {
          border.style.opacity = "0";
        }

        if (s.bars === "off") {
          barGroup.style.opacity = "1";
        }

        renderStatus();
      }

      /*
        ONE animation loop for Active and Waiting.

        requestAnimationFrame is synced to browser painting.
        We never request 5 ms / 10 ms timers anymore.
      */
      function animationFrame(now) {
        advanceMasterPhase(now);
        render();
        rafId = requestAnimationFrame(animationFrame);
      }

      function startAnimation(resetPhase = false) {
        if (resetPhase) {
          phaseTicks = 0;
        }

        /*
          Reset the timestamp whenever state/speed changes so elapsed
          time from before the change is not incorrectly applied.
        */
        lastFrameTime = null;

        if (rafId === null) {
          rafId = requestAnimationFrame(animationFrame);
        } else {
          render();
        }
      }

      function selectButton(buttons, datasetKey, value) {
        buttons.forEach(button => {
          button.classList.toggle(
            "active",
            button.dataset[datasetKey] === value
          );
        });
      }

      function setState(state) {
        currentState = state;

        selectButton(stateButtons, "state", state);

        activeSettings.classList.toggle(
          "visible",
          state === "active"
        );

        waitingSettings.classList.toggle(
          "visible",
          state === "waiting"
        );

        /*
          Each state starts at the same master phase.
          Active and Waiting therefore use identical timing semantics.
        */
        startAnimation(true);
      }

      function bindOption(
        buttons,
        datasetKey,
        state,
        configKey
      ) {
        buttons.forEach(button => {
          button.addEventListener("click", () => {
            config[state][configKey] =
              button.dataset[datasetKey];

            selectButton(
              buttons,
              datasetKey,
              config[state][configKey]
            );

            if (currentState === state) {
              render();
            }
          });
        });
      }

      /*
        Same exact slider behavior for Active and Waiting.

        "input" updates speed continuously while dragging.
        No timer is destroyed/recreated, because rAF always runs.

        Resetting lastFrameTime prevents an old delta from being
        interpreted using the newly selected speed.
      */
      function bindSpeedSlider(
        slider,
        valueLabel,
        state
      ) {
        slider.addEventListener("input", () => {
          config[state].speed = Number(slider.value);

          valueLabel.textContent =
            `${config[state].speed} ms / logical tick`;

          if (currentState === state) {
            lastFrameTime = null;
          }
        });
      }

      stateButtons.forEach(button => {
        button.addEventListener("click", () => {
          setState(button.dataset.state);
        });
      });

      bindOption(
        activeBorderButtons,
        "activeBorder",
        "active",
        "border"
      );

      bindOption(
        activeBarButtons,
        "activeBars",
        "active",
        "bars"
      );

      bindOption(
        activeBarStyleButtons,
        "activeBarStyle",
        "active",
        "barStyle"
      );

      bindOption(
        activePeakHoldButtons,
        "activePeakHold",
        "active",
        "peakHold"
      );

      bindOption(
        activePulseButtons,
        "activePulse",
        "active",
        "pulse"
      );

      bindOption(
        activePulseStyleButtons,
        "activePulseStyle",
        "active",
        "pulseStyle"
      );

      bindOption(
        waitingPulseButtons,
        "waitingPulse",
        "waiting",
        "pulse"
      );

      bindOption(
        waitingPulseStyleButtons,
        "waitingPulseStyle",
        "waiting",
        "pulseStyle"
      );

      bindSpeedSlider(
        activeSpeedSlider,
        activeSpeedValue,
        "active"
      );

      bindSpeedSlider(
        waitingSpeedSlider,
        waitingSpeedValue,
        "waiting"
      );

      activeSpeedValue.textContent =
        `${config.active.speed} ms / logical tick`;

      waitingSpeedValue.textContent =
        `${config.waiting.speed} ms / logical tick`;

      setState("active");
    </script>
  </main>
</body>
</html>
